name: Verify local contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest==8.3.5
      - run: python -m pytest worker/tests security/tests wall/tests wall/isolation -q
        working-directory: stapled-factory
      - run: npm ci
        working-directory: stapled-factory/spine
      - run: npm run build && node --test tests/*.test.mjs
        working-directory: stapled-factory/spine
